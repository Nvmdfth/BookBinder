version: '3.8'

services:
  # 1. Persistent PostgreSQL Database Container
  db:
    image: postgres:16-alpine
    container_name: bookbinder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookbinder}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-bookbinder}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Unified Web & API Express App Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookbinder-app
    restart: unless-stopped
    ports:
      # Exposes Direct HTTP port 5000 to the host (Cloudflare Tunnel routes directly here!)
      - "${PORT:-5000}:5000"
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-bookbinder}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-bookbinder_super_secret_session_token_key}
      BOOKBINDER_ADMIN_EMAIL: ${BOOKBINDER_ADMIN_EMAIL:-admin@library.com}
      BOOKBINDER_ADMIN_PASS: ${BOOKBINDER_ADMIN_PASS:-adminpassword123}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      # Abuse protection. TRUST_PROXY_HOPS must match the number of proxies in
      # front of this port, or the rate limiters key on a forgeable address.
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_ADMIN_MAX: ${RATE_LIMIT_ADMIN_MAX:-60}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      NODE_ENV: production
    volumes:
      # Persistent storage volume for user avatar image uploads
      - uploads_data:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
    name: bookbinder-pg-data
  uploads_data:
    name: bookbinder-uploads-data
